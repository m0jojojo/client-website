services:
  db:
    image: postgres:16-alpine
    container_name: client-website-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blockbagru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockbagru_dev}
      POSTGRES_DB: ${POSTGRES_DB:-blockbagru}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockbagru}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
